{% comment %}
  Renders a row of small link buttons from a `links` hash, e.g. {pdf: ..., code: ...}.
  Usage: {% include link-buttons.html links=item.links %}
{% endcomment %}
{% if include.links %}
<div class="link-buttons">
  {% for link in include.links %}
  <a class="btn-small" href="{{ link[1] }}">{{ link[0] | upcase }}</a>
  {% endfor %}
</div>
{% endif %}
