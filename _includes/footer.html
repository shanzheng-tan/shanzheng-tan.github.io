<footer class="site-footer">
  <div class="container footer-inner">
    <p>&copy; {{ site.time | date: "%Y" }} {{ site.data.profile.name }}</p>
    <p class="footer-links">
      {% for link in site.data.profile.links %}
      <a href="{{ link.url }}">{{ link.label }}</a>
      {% endfor %}
    </p>
  </div>
</footer>
