- title: Inside Line Sim
  summary: >-
    Browser simulator for marathon canoe and kayak racing. Reshape the river,
    model current and boat wash, and race K1/K2/C1/C2 formations to find the
    faster line before race day.
  image: /assets/img/projects/inside-line-sim.png
  year: 2026
  tags: [JavaScript, Simulation, Paddling]
  featured: true
  links:
    live: https://shan-sherif.github.io/inside-line-sim/

- title: Pi MIDI Router
  summary: >-
    Standalone MIDI router for Raspberry Pi. Route, remap channels and filter
    USB MIDI gear from a web dashboard, then play with no computer or DAW.
  image: /assets/img/projects/pi-midi-router.png
  image_position: top left
  year: 2026
  tags: [Raspberry Pi, Python, MIDI]
  featured: true
  links:
